apiVersion: v1
kind: Namespace
metadata:
  name: kardia
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kardia-agent
  namespace: kardia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kardia-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kardia-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kardia-agent
subjects:
  - kind: ServiceAccount
    name: kardia-agent
    namespace: kardia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kardia-agent
  namespace: kardia
  labels:
    app: kardia-agent
spec:
  selector:
    matchLabels:
      app: kardia-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app: kardia-agent
    spec:
      serviceAccountName: kardia-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: ghcr.io/sivaangayarkanni/kardia:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -mode=agent
            - -ingest-url=http://kardia-analyzer.kardia.svc:8080/api/v1/ingest
            - -scenario=off
            - -interval=1s
          env:
            - name: KARDIA_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KARDIA_CLUSTER
              value: prod
            - name: KARDIA_PLATFORM
              value: kubernetes
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            privileged: false
            capabilities:
              add: ["BPF", "PERFMON", "SYS_RESOURCE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kardia-analyzer
  namespace: kardia
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kardia-analyzer
  template:
    metadata:
      labels:
        app: kardia-analyzer
    spec:
      containers:
        - name: analyzer
          image: ghcr.io/sivaangayarkanni/kardia:0.1.0
          args:
            - -mode=analyzer
            - -listen=:8080
            - -workers=8
            - -queue=4096
            - -scenario=off
            - -replica=$(POD_NAME)
            - -replicas=kardia-analyzer-0,kardia-analyzer-1,kardia-analyzer-2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kardia-analyzer
  namespace: kardia
spec:
  selector:
    app: kardia-analyzer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kardia-analyzer
  namespace: kardia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kardia-analyzer
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
