<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kardia — incident diagnosis</title>
<style>
  :root { color-scheme: dark; --bg:#0e1214; --panel:#171d21; --line:#2a343b; --text:#e7eee9; --muted:#8ea099; --crit:#ff5d5d; --high:#ffb020; --warn:#e6d36a; --ok:#3dd68c; --info:#7eb6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:end; padding:22px 28px 12px; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; }
  h1 span { color:var(--muted); font-weight:450; }
  .meta { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 70px); }
  aside { border-right:1px solid var(--line); padding:12px; overflow:auto; }
  section { padding:18px 28px 40px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .card.active { border-color:#6f8f7a; }
  .sev { font-size:11px; font-weight:650; letter-spacing:0.06em; text-transform:uppercase; }
  .crit { color:var(--crit); } .high { color:var(--high); } .warning { color:var(--warn); } .info { color:var(--info); }
  .title { margin:4px 0; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; }
  h2 { margin:0 0 8px; font-size:18px; }
  .cause { background:#12181b; border-left:3px solid var(--ok); padding:12px 14px; margin:12px 0; }
  ul { margin:8px 0 0; padding-left:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .empty { color:var(--muted); padding:24px 8px; }
  code { font-family: ui-monospace, monospace; font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Kardia <span>system incident diagnosis</span></h1>
    <div class="meta" id="status">connecting…</div>
  </div>
  <div class="meta">Linux · Kubernetes · VM · bare metal</div>
</header>
<main>
  <aside id="list"><div class="empty">Waiting for the first window…</div></aside>
  <section id="detail"><div class="empty">Select an incident. Explanations come from aggregated eBPF and /proc signals, not application traces.</div></section>
</main>
<script>
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const statusEl = document.getElementById('status');
let selected = null;
let incidents = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return ({'&':'&','<':'<','>':'>','"':'"'})[c];
  });
}

function renderList() {
  if (!incidents.length) {
    listEl.innerHTML = '<div class="empty">No incidents. Healthy windows stay silent.</div>';
    return;
  }
  listEl.innerHTML = incidents.map(function(i) {
    return '<div class="card ' + (selected===i.id?'active':'') + '" data-id="' + esc(i.id) + '">'
      + '<div class="sev ' + esc(i.severity) + '">' + esc(i.severity) + ' · ' + esc(i.status) + ' · ' + Math.round((i.confidence||0)*100) + '%</div>'
      + '<div class="title">' + esc(i.title) + '</div>'
      + '<div class="sub">' + esc(i.identity && i.identity.platform) + ' · ' + esc(i.fault) + ' · ' + i.windows + ' windows</div>'
      + '</div>';
  }).join('');
  listEl.querySelectorAll('.card').forEach(function(el) {
    el.onclick = function() { selected = el.dataset.id; renderList(); renderDetail(); };
  });
}

function renderDetail() {
  const i = incidents.find(function(x) { return x.id === selected; }) || incidents[0];
  if (!i) { detailEl.innerHTML = ''; return; }
  selected = i.id;
  const ev = (i.evidence||[]).map(function(e) {
    return '<tr><td><code>' + esc(e.signal) + '</code></td><td>' + Number(e.value).toPrecision(4) + '</td><td>' + e.threshold + '</td><td>' + esc(e.note) + '</td></tr>';
  }).join('');
  const rec = (i.recommendations||[]).map(function(r) { return '<li>' + esc(r) + '</li>'; }).join('');
  const id = i.identity || {};
  const who = id.pod || id.vm_id || id.host || id.node || '';
  detailEl.innerHTML = '<div class="sev ' + esc(i.severity) + '">' + esc(i.severity) + ' · ' + esc(i.status) + ' · source ' + esc(i.source) + '</div>'
    + '<h2>' + esc(i.title) + '</h2>'
    + '<div class="sub">' + esc(id.platform) + ' ' + esc(id.cluster) + ' ' + esc(id.namespace) + ' ' + esc(who) + '</div>'
    + '<p>' + esc(i.summary) + '</p>'
    + '<div class="cause"><strong>Root cause. </strong>' + esc(i.root_cause) + '</div>'
    + '<h3>Evidence</h3><table><tr><th>Signal</th><th>Value</th><th>Threshold</th><th>Why it matters</th></tr>' + ev + '</table>'
    + '<h3>What to do</h3><ul>' + rec + '</ul>';
}

async function refresh() {
  const res = await fetch('/api/v1/incidents?limit=50');
  const body = await res.json();
  incidents = body.incidents || [];
  renderList();
  if (selected || incidents[0]) renderDetail();
  const st = await fetch('/api/v1/status').then(function(r) { return r.json(); });
  const bpf = st.ebpf || {};
  statusEl.textContent = 'open ' + st.store.open + ' · batches ' + st.pipeline.accepted_batches + ' · dropped ' + st.pipeline.dropped_batches + ' · ' + (bpf.Reason || 'eBPF probe pending');
}

refresh();
setInterval(refresh, 2000);
const es = new EventSource('/api/v1/stream');
es.addEventListener('incident', function() { refresh(); });
</script>
</body>
</html>
